version: '3.8'

services:
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./apps/api:/app/apps/api
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=development
    command: uv run uvicorn apps.api.main:app --reload --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  data:

networks:
  default:
    name: pdf-markdown-network-dev
