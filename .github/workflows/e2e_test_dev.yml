name: E2E Tests (Next.js Dev Server)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run E2E Tests with Next.js Dev Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x"]
        python-version: ["3.11"]

    defaults:
      run:
        working-directory: ./tests/e2e

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.4.30"

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        run: |
          echo "Setting up pnpm via npm..."

          # npmの設定を確認
          echo "npm registry: $(npm config get registry)"

          # npmを使用してpnpmをインストール
          npm install -g pnpm@9.15.0

          # バージョン確認
          pnpm --version

          # レジストリ設定
          pnpm config set registry https://registry.npmjs.org/

          # 設定確認
          echo "pnpm registry: $(pnpm config get registry)"

          echo "pnpm installed successfully via npm"
        env:
          NODE_ENV: production
          CI: true

      - name: Verify pnpm installation
        run: |
          echo "Verifying pnpm installation..."

          # pnpmのパスを確認
          which pnpm

          # バージョン確認
          pnpm --version

          # pnpmの設定確認
          pnpm config list

          echo "pnpm is ready to use"

      - name: Setup pnpm fallback if needed
        if: failure()
        run: |
          echo "pnpm verification failed, trying alternative installation..."

          # 既存のpnpmを削除
          npm uninstall -g pnpm || true

          # キャッシュをクリア
          npm cache clean --force

          # 再インストール
          npm install -g pnpm@9.15.0

          # 再確認
          pnpm --version

          echo "pnpm fallback installation completed"

      - name: Get pnpm store directory
        shell: bash
        run: |
          # pnpmが利用可能かチェック
          if command -v pnpm >/dev/null 2>&1; then
            STORE_PATH=$(pnpm store path --silent 2>/dev/null || echo "$HOME/.pnpm-store")
            echo "STORE_PATH=$STORE_PATH" >> $GITHUB_ENV
            echo "pnpm store path: $STORE_PATH"
          else
            echo "pnpm not available, using default store path"
            echo "STORE_PATH=$HOME/.pnpm-store" >> $GITHUB_ENV
          fi

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup UV cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Python dependencies
        run: |
          cd ../../
          uv sync

      - name: Install E2E test dependencies
        run: |
          echo "Installing E2E test dependencies..."
          pnpm install --frozen-lockfile --prefer-offline
          echo "E2E dependencies installed successfully"

      - name: Install UI dependencies
        run: |
          cd ../../
          cd src/ui
          echo "Installing UI dependencies..."

          # 現在のディレクトリとファイルの確認
          echo "Current directory: $(pwd)"
          echo "Package.json exists: $(test -f package.json && echo 'Yes' || echo 'No')"
          echo "pnpm version: $(pnpm --version)"

          # 依存関係のインストール（本番依存関係も含む）
          if pnpm install --frozen-lockfile --prefer-offline --prod=false; then
            echo "UI dependencies installed successfully"
          else
            echo "pnpm install failed, trying with npm..."
            npm ci
          fi

          # Next.jsの確認
          echo "Checking Next.js installation..."
          pnpm list next || npm list next

          # Tailwind CSSの確認
          echo "Checking Tailwind CSS installation..."
          pnpm list tailwindcss || npm list tailwindcss

          # package.jsonの確認
          echo "Package.json scripts:"
          cat package.json | grep -A 5 -B 5 "scripts"
        env:
          NODE_ENV: development
          CI: true

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          echo "Installing Playwright browsers..."
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec playwright install chromium --with-deps
          else
            npx playwright install chromium --with-deps
          fi
          echo "Playwright browsers installed successfully"

      - name: Check and kill existing processes
        run: |
          # ポート8000と3000を使用しているプロセスを確認・停止
          echo "Checking for existing processes on ports 8000 and 3000..."

          if lsof -i :8000 > /dev/null 2>&1; then
            echo "Port 8000 is in use. Stopping existing process..."
            lsof -ti :8000 | xargs kill -9 || true
            sleep 2
          fi

          if lsof -i :3000 > /dev/null 2>&1; then
            echo "Port 3000 is in use. Stopping existing process..."
            lsof -ti :3000 | xargs kill -9 || true
            sleep 2
          fi

          # プロセスが完全に停止するまで待機
          sleep 5

      - name: Start API server
        run: |
          cd ../../
          export ENVIRONMENT=test
          export PYTHONPATH=/home/runner/work/api-test-automation-samples/api-test-automation-samples

          # データベースディレクトリを作成
          mkdir -p data/uploads data/markdown

          # APIサーバーを起動
          echo "Starting API server..."
          echo "Current directory: $(pwd)"
          echo "Python path: $PYTHONPATH"

          # 既存のプロセスを確認
          echo "Checking for existing processes on port 8000..."
          lsof -i :8000 || echo "No existing process on port 8000"

          # ファイルの存在確認
          echo "Checking main.py existence:"
          ls -la src/api/main.py || echo "main.py not found"

          # Pythonパッケージの確認
          echo "Checking Python packages:"
          uv pip list | grep -E "(fastapi|uvicorn)" || echo "FastAPI/Uvicorn not found"

          # APIサーバーを起動
          echo "Starting uvicorn server..."
          nohup uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --log-level info > api_server.log 2>&1 &
          echo $! > api_server.pid

          echo "API server started with PID: $(cat api_server.pid)"

          # プロセスが起動しているか確認
          sleep 5
          if kill -0 $(cat api_server.pid) 2>/dev/null; then
            echo "API server process is running"
          else
            echo "API server process failed to start"
            echo "=== API Server Log ==="
            cat api_server.log
            echo "=== Process Status ==="
            ps aux | grep uvicorn | grep -v grep || echo "No uvicorn process found"
            echo "=== Port Status ==="
            lsof -i :8000 || echo "Port 8000 is not in use"
            echo "=== Directory Contents ==="
            ls -la src/api/
            echo "=== Main.py Contents (first 20 lines) ==="
            head -20 src/api/main.py || echo "Could not read main.py"
            exit 1
          fi

          # サーバー起動を待機
          echo "Waiting for API server to be ready..."
          sleep 15

          # ログを確認
          echo "API server log:"
          cat api_server.log
        env:
          ENVIRONMENT: test
          PYTHONPATH: /home/runner/work/api-test-automation-samples/api-test-automation-samples

      - name: Verify API server is running
        run: |
          cd ../../
          echo "Checking API server health..."

          # プロセス状態の確認
          if [ -f api_server.pid ]; then
            if kill -0 $(cat api_server.pid) 2>/dev/null; then
              echo "API server process is running with PID: $(cat api_server.pid)"
            else
              echo "API server process is not running"
              cat api_server.log
              exit 1
            fi
          fi

          # ポートの確認
          echo "Checking port 8000..."
          lsof -i :8000 || echo "Port 8000 is not in use"

          # ヘルスチェックの実行
          echo "Starting health check..."
          timeout 60s bash -c 'until curl -f http://localhost:8000/system/health 2>/dev/null; do sleep 2; echo "Waiting for API server..."; done'
          echo "API server is running successfully"

          # ヘルスチェックの詳細を確認
          echo "API server health check:"
          curl -v http://localhost:8000/system/health

          # 利用可能なエンドポイントの確認
          echo "Available endpoints:"
          curl -s http://localhost:8000/docs 2>/dev/null | grep -o 'href="[^"]*"' | head -10 || echo "Could not fetch OpenAPI docs"

      - name: Start UI server with Next.js production build and static server
        run: |
          cd ../../
          echo "Starting UI server with Next.js production build and static server..."

          # UIサーバーを起動
          cd src/ui

          # 依存関係の確認（既にインストール済みの場合はスキップ）
          echo "Checking UI dependencies..."
          if [ ! -d "node_modules" ] || [ ! -f "node_modules/.pnpm/next" ]; then
            echo "Installing UI dependencies..."
            pnpm install --frozen-lockfile --prod=false
          else
            echo "UI dependencies already installed, skipping..."
          fi

          # ビルドに必要な依存関係の確認
          echo "Verifying build dependencies..."
          echo "Checking Next.js:"
          pnpm list next
          echo "Checking Tailwind CSS:"
          pnpm list tailwindcss
          echo "Checking PostCSS:"
          pnpm list postcss
          echo "Checking Autoprefixer:"
          pnpm list autoprefixer

          # Tailwind CSS設定ファイルの確認
          echo "Checking Tailwind CSS configuration..."
          if [ -f "tailwind.config.js" ]; then
            echo "Tailwind config exists:"
            cat tailwind.config.js
          else
            echo "Tailwind config not found!"
            exit 1
          fi

          # PostCSS設定ファイルの確認
          echo "Checking PostCSS configuration..."
          if [ -f "postcss.config.js" ]; then
            echo "PostCSS config exists:"
            cat postcss.config.js
          else
            echo "PostCSS config not found!"
            exit 1
          fi

          # 既存のプロセスを確認・停止
          echo "Checking for existing processes on port 3000..."
          if lsof -i :3000 > /dev/null 2>&1; then
            echo "Port 3000 is in use, stopping existing process..."
            lsof -ti :3000 | xargs kill -9 || true
            sleep 3
          fi

          # 本番ビルドを実行
          echo "Building Next.js application for production..."
          export NODE_ENV=production
          export NEXT_TELEMETRY_DISABLED=1
          export CI=true

          # ビルドの実行
          echo "Starting build process..."
          if pnpm build; then
            echo "Build completed successfully"

            # ビルド結果の確認
            echo "Build output directory contents:"
            ls -la .next/
          else
            echo "Build failed, checking logs..."
            exit 1
          fi

          # 軽量HTTPサーバーを起動
          echo "Starting lightweight HTTP server for static files..."
          export PORT=3000
          export HOSTNAME=0.0.0.0

          # serveパッケージを使用して静的ファイルを配信
          if [ -f "node_modules/.pnpm/serve" ]; then
            echo "Using serve package..."
            nohup npx serve .next -p 3000 -l 0.0.0.0:3000 > ../../ui_server.log 2>&1 &
          else
            echo "Installing serve package..."
            pnpm add -D serve
            nohup npx serve .next -p 3000 -l 0.0.0.0:3000 > ../../ui_server.log 2>&1 &
          fi

          # 代替案: 開発サーバーの最適化（静的配信が問題がある場合）
          # echo "Alternative: Starting optimized development server..."
          # export NODE_ENV=development
          # export NEXT_TELEMETRY_DISABLED=1
          # export NEXT_FAST_REFRESH=false
          # export NEXT_WEBPACK_USEPOLLING=false
          #
          # nohup pnpm dev > ../../ui_server.log 2>&1 &

          SERVER_PID=$!
          echo $SERVER_PID > ../../ui_server.pid

          echo "Static server started with PID: $SERVER_PID"
          echo "PID file created: ../../ui_server.pid"

          # サーバー起動を待機（静的サーバーは起動が早い）
          echo "Waiting for static server to start..."
          sleep 15

          # ログを確認
          echo "UI server log:"
          cat ../../ui_server.log

          # プロセス状態の確認
          if [ -f ../../ui_server.pid ]; then
            if kill -0 $(cat ../../ui_server.pid) 2>/dev/null; then
              echo "UI server process is running"

              # プロセスの詳細確認
              echo "Process details:"
              ps -p $(cat ../../ui_server.pid) -o pid,ppid,cmd,etime

              # プロセスが使用しているポートを確認
              echo "Ports used by the process:"
              netstat -tlnp 2>/dev/null | grep $(cat ../../ui_server.pid) || echo "No ports found for this process"

              # ポート3000の状況を確認
              echo "Port 3000 status:"
              lsof -i :3000 || echo "Port 3000 is not in use"

              # プロセスの子プロセスも確認
              echo "Child processes:"
              ps --forest -g $(cat ../../ui_server.pid) 2>/dev/null || echo "No child processes found"

              # 起動ログの詳細確認
              echo "Recent server logs:"
              tail -20 ../../ui_server.log

              # 環境変数の確認
              echo "Environment variables:"
              echo "PORT: $PORT"
              echo "HOSTNAME: $HOSTNAME"
              echo "NODE_ENV: $NODE_ENV"
            else
              echo "UI server process is not running"
              exit 1
            fi
          fi
        env:
          NODE_ENV: production
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
          PYTHONPATH: /home/runner/work/api-test-automation-samples/api-test-automation-samples

      - name: Verify UI server is running
        run: |
          cd ../../
          echo "Checking UI server..."

          # UIサーバーの起動確認（本番ビルド用に最適化）
          echo "Phase 1: Process status check..."
          if [ -f ui_server.pid ]; then
            if ! kill -0 $(cat ui_server.pid) 2>/dev/null; then
              echo "UI server process died, checking logs..."
              if [ -f ui_server.log ]; then
                cat ui_server.log
              fi
              echo "UI server failed to start"
              exit 1
            fi
            echo "UI server process is running with PID: $(cat ui_server.pid)"
          else
            echo "UI server PID file not found"
            exit 1
          fi

          echo "Phase 2: Port availability check..."
          if ! lsof -i :3000 > /dev/null 2>&1; then
            echo "Port 3000 is not available"
            exit 1
          fi
          echo "Port 3000 is available"

          echo "Phase 3: HTTP response check..."
          # 本番ビルドは起動が早いため、より短い間隔でチェック
          for i in {1..15}; do
            echo "Attempt $i/15: Checking UI server response..."

            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "UI server is responding successfully!"

              # レスポンスの詳細確認
              echo "UI server response details:"
              curl -I http://localhost:3000

              # ページの内容を確認
              echo "Page content preview:"
              curl -s http://localhost:3000 | head -20
              break
            fi

            echo "UI server not ready yet, waiting..."
            sleep 2

            # タイムアウトチェック（本番ビルドは30秒で十分）
            if [ $i -eq 15 ]; then
              echo "UI server failed to start within 30 seconds"
              echo "Final UI server log:"
              if [ -f ui_server.log ]; then
                cat ui_server.log
              fi
              echo "Process status:"
              ps aux | grep "next\|pnpm" | grep -v grep || echo "No Next.js process found"
              echo "Port 3000 status:"
              lsof -i :3000 || echo "Port 3000 is not in use"
              exit 1
            fi
          done

          echo "UI server is running successfully"

          # UIサーバーの詳細確認
          echo "UI server check:"
          curl -v http://localhost:3000

      - name: Run comprehensive E2E tests
        run: |
          # テスト用の環境変数を設定
          export CI=true
          export ENVIRONMENT=test
          export PWTEST_SKIP_TEST_OUTPUT=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1

          # 全テストを実行（API、UI、統合テスト）
          echo "Running comprehensive E2E tests..."

          # テストの実行順序を制御
          echo "Phase 1: Running API tests..."
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec playwright test \
              --project=api-tests \
              --max-failures=3 \
              --workers=1 \
              --retries=3 \
              --timeout=60000
          else
            npx playwright test \
              --project=api-tests \
              --max-failures=3 \
              --workers=1 \
              --retries=3 \
              --timeout=60000
          fi

          echo "Phase 2: Running integration tests..."
          if command -v pnpm >/dev/null 2>&1; then
            pnpm exec playwright test \
              --project=integration-tests \
              --max-failures=3 \
              --workers=1 \
              --retries=3 \
              --timeout=60000
          else
            npx playwright test \
              --project=integration-tests \
              --max-failures=3 \
              --workers=1 \
              --retries=3 \
              --timeout=60000
          fi

      - name: Aggregate test results
        run: |
          echo "=== Test Results Summary ==="

          # テスト結果ファイルの確認
          if [ -d "test-results" ]; then
            echo "Test results directory contents:"
            ls -la test-results/

            # 結果ファイルの解析
            if [ -f "test-results/results.json" ]; then
              echo "Test results summary:"
              cat test-results/results.json | jq '.stats' || echo "Could not parse test results"
            fi
          fi

          # Playwrightレポートの確認
          if [ -d "playwright-report" ]; then
            echo "Playwright report generated successfully"
          else
            echo "Playwright report not found"
          fi

      - name: Stop servers
        if: always()
        run: |
          cd ../../
          echo "Stopping servers..."

          # APIサーバーを停止
          if [ -f api_server.pid ]; then
            echo "Stopping API server..."
            kill $(cat api_server.pid) 2>/dev/null || true
            rm -f api_server.pid
          fi

          # UIサーバーを停止
          if [ -f ui_server.pid ]; then
            echo "Stopping UI server..."
            kill $(cat ui_server.pid) 2>/dev/null || true
            rm -f ui_server.pid
          fi

          # ログファイルを保存
          if [ -f api_server.log ]; then
            echo "API server log:"
            cat api_server.log
          fi

          if [ -f ui_server.log ]; then
            echo "UI server log:"
            cat ui_server.log
          fi

      - name: Upload test results and reports
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-test-results-node-${{ matrix.node-version }}
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload server logs
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: server-logs-node-${{ matrix.node-version }}
          path: |
            api_server.log
            ui_server.log
          retention-days: 14

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🎭 Playwright E2E Tests Completed (Next.js Dev Server)

            ✅ **Comprehensive E2E tests have been completed successfully!**

            **Test Results:**
            - **Status**: All tests completed
            - **Node.js**: ${{ matrix.node-version }}
            - **Python**: ${{ matrix.python-version }}
            - **UI Server**: Next.js Development Server

            **What was tested:**
            - ✅ API endpoints and health checks
            - ✅ Frontend UI components (Next.js Dev Server)
            - ✅ UI-API integration and communication
            - ✅ File upload and processing workflows
            - ✅ End-to-end user experience

            📊 **Reports & Logs:**
            - [View HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [View Workflow Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

            💡 **Next Steps:**
            - Review the detailed HTML report for test coverage
            - Check server logs if any issues occurred
            - All artifacts are available for download above`;

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              console.log('PR comment posted successfully');
            } catch (error) {
              console.error('Failed to create PR comment:', error);
            }
