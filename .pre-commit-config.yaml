repos:
  # ruffによるPythonコードの品質検査と自動整形
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
      # コード品質検査（lint）
      - id: ruff
        args: [--fix]
        types: [python]
      # コードフォーマット
      - id: ruff-format
        types: [python]

  # 基本的なファイルチェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # ファイル末尾の改行確認
      - id: end-of-file-fixer
      # ファイル末尾の空白削除
      - id: trailing-whitespace
      # ファイル末尾の改行確認
      - id: check-yaml
      # JSONファイルの構文チェック
      - id: check-json
      # マージコンフリクトマーカーの確認
      - id: check-merge-conflict
      # 大きなファイルの確認（1MB制限）
      - id: check-added-large-files
        args: ['--maxkb', '1024']
        exclude: |
          (?x)^(
              src/api/data/uploads/|
              data/uploads/|
              tests/data/uploads/|
              \.git/|
              \.venv/|
              venv/|
              node_modules/
          )$

# グローバル設定
default_language_version:
  python: python3.13

# 除外するファイル
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      node_modules/|
      ui/|
      tests/e2e/|
      \.pytest_cache/|
      __pycache__/|
      \.mypy_cache/|
      build/|
      dist/|
      \.coverage|
      coverage\.xml|
      htmlcov/|
      \.ruff_cache/|
      src/api/data/uploads/|
      data/uploads/|
      tests/data/uploads/
  )$
